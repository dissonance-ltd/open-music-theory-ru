[book]
title = "Открытая теория музыки"
authors = ["Участники Open Music Theory RU"]
language = "ru"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/dissonance-ltd/open-music-theory-ru"
edit-url-template = "https://github.com/dissonance-ltd/open-music-theory-ru/edit/main/{path}"
site-url = "/open-music-theory-ru/"
additional-css = ["theme/omt-ru.css"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
