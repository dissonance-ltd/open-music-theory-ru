terms:
- en: pitch
  ru: высота звука
  status: candidate
  alternatives:
  - звуковысотность
  note: Требуется согласовать употребление термина как свойства звука и как отдельной высоты.
- en: pitch class
  ru: высотный класс
  status: candidate
  alternatives:
  - класс высот
  note: Особенно важно согласовать с терминологией теории множеств.
- en: scale degree
  ru: ступень гаммы
  status: candidate
  alternatives:
  - ступень звукоряда
- en: voice leading
  ru: голосоведение
  status: candidate
- en: tonicization
  ru: тоникализация
  status: candidate
  alternatives:
  - временная тонизация
  note: Выбор зависит от принятой терминологии функциональной гармонии.
- en: musical notation
  ru: музыкальная нотация
  status: candidate
  note: Система записи музыки; не только привычная пятилинейная запись.
- en: note
  ru: нота
  status: candidate
  note: В этой главе — знак, обозначающий высоту и длительность звука; в других контекстах слово
    может обозначать сам звук.
- en: staff
  ru: нотный стан
  status: candidate
  note: 'Допустимый синоним: нотоносец.'
- en: notehead
  ru: головка ноты
  status: candidate
  note: ''
- en: stem
  ru: штиль
  status: candidate
  note: ''
- en: beam
  ru: вязка
  status: candidate
  note: Горизонтальная или наклонная линия, соединяющая штили; не путать с лигой.
- en: flag
  ru: флажок
  status: candidate
  note: ''
- en: clef
  ru: ключ
  status: candidate
  note: ''
- en: treble clef
  ru: скрипичный ключ
  status: candidate
  note: Ключ соль на второй линейке снизу.
- en: bass clef
  ru: басовый ключ
  status: candidate
  note: Ключ фа на четвёртой линейке снизу.
- en: alto clef
  ru: альтовый ключ
  status: candidate
  note: Ключ до на третьей линейке снизу.
- en: tenor clef
  ru: теноровый ключ
  status: candidate
  note: Ключ до на четвёртой линейке снизу.
- en: ledger line
  ru: добавочная линейка
  status: candidate
  note: ''
- en: rhythm
  ru: ритм
  status: candidate
  note: ''
- en: meter
  ru: метр
  status: candidate
  note: Не смешивать с графическим обозначением размера.
- en: time signature
  ru: тактовый размер (обозначение)
  status: candidate
  note: 'В зависимости от контекста: размер или обозначение размера.'
- en: compound meter
  ru: метр с трёхчастным делением доли
  status: candidate
  note: Рабочее описательное соответствие. Английское compound относится к делению основной
    доли на три; не равно безусловно русскому «сложный размер».
- en: simple meter
  ru: метр с двухчастным делением доли
  status: candidate
  note: Рабочее описательное соответствие; не равно безусловно русскому «простой размер».
- en: second
  ru: секунда
  status: candidate
  note: Интервал, не единица времени.
- en: middle C
  ru: до первой октавы
  status: candidate
  note: C4 в научной нумерации октав; номер октавы в DAW может отличаться.
- en: relative keys
  ru: параллельные тональности
  status: candidate
  note: Например, до мажор и ля минор.
- en: parallel keys
  ru: одноимённые тональности
  status: candidate
  note: Например, до мажор и до минор; не переводить как «параллельные».
- en: grand staff
  ru: объединённый нотный стан
  status: candidate
  note: 'Рабочее соответствие: два нотоносца, объединённых для записи одной партии, например
    фортепианной.'
- en: milieu
  ru: социально-культурная среда
  status: candidate
  note: Контекст создания и употребления системы записи.
- en: range
  ru: диапазон
  status: candidate
  note: Совокупность высот, доступных голосу или инструменту; также расстояние между крайними
    высотами.
- en: octave
  ru: октава
  status: candidate
  note: Интервал между одноимёнными звуками с отношением частот 2:1; также название участка
    звукоряда.
- en: octave equivalence
  ru: октавная эквивалентность
  status: candidate
  note: Одноимённость звуков в разных октавах, а не равенство их высот.
- en: mnemonic device
  ru: мнемонический приём
  status: candidate
  note: Способ облегчить запоминание, например фраза по начальным буквам.
- en: audiate
  ru: внутренне слышать
  status: candidate
  note: Мысленно представлять звучание музыки.
- en: brace
  ru: акколада
  status: candidate
  note: Здесь фигурная скобка, объединяющая два нотных стана.
- en: interval
  ru: интервал
  status: candidate
  note: Соотношение двух звуков по высоте; в начальном изложении — расстояние между ними.
- en: generic interval
  ru: ступеневая величина интервала
  status: candidate
  note: Счёт ступеней с включением обоих крайних звуков; не число полутонов.
- en: half step
  ru: полутон
  status: candidate
  note: На описанной клавиатуре — расстояние до ближайшей клавиши любого цвета; 1/12 равномерно
    темперированной октавы.
- en: whole step
  ru: тон
  status: candidate
  note: Интервал в два полутона; не путать с другими значениями слова tone.
- en: accidental
  ru: знак альтерации
  status: candidate
  note: 'Знак изменения высоты: диез, бемоль, бекар и двойные знаки.'
- en: sharp
  ru: диез
  status: candidate
  note: Повышает основной звук на полутон.
- en: flat
  ru: бемоль
  status: candidate
  note: Понижает основной звук на полутон.
- en: natural
  ru: бекар; неальтерированный звук
  status: candidate
  note: Название знака — бекар; при описании ноты — без повышения или понижения.
- en: double sharp
  ru: дубль-диез
  status: candidate
  note: Повышает основной звук на тон.
- en: double flat
  ru: дубль-бемоль
  status: candidate
  note: Понижает основной звук на тон.
- en: enharmonic equivalence
  ru: энгармоническое равенство
  status: candidate
  note: Разное написание одного звучания в рассматриваемом строе; в этой главе — равномерная
    темперация.
- en: American Standard Pitch Notation (ASPN)
  ru: американская стандартная система обозначения высоты звука (ASPN)
  status: candidate
  note: 'Обозначение конкретной высоты буквенным названием ноты и номером октавы. Номер меняется
    на C; C4 — до первой октавы. Альтерация не меняет номер буквенной записи: B♯3 = C4 по звучанию.
    Основание: пилот глав 6–8, docs/reviews/aspn.md; статус candidate.'
- en: dynamics
  ru: динамика
  status: candidate
  note: 'Громкость и её изменения. Основание: пилот глав 6–8, docs/reviews/other-notation.md;
    статус candidate.'
- en: crescendo
  ru: крещендо
  status: candidate
  note: 'Постепенное усиление громкости. Основание: пилот глав 6–8, docs/reviews/other-notation.md;
    статус candidate.'
- en: decrescendo
  ru: декрещендо
  status: candidate
  note: 'Постепенное ослабление громкости. Основание: пилот глав 6–8, docs/reviews/other-notation.md;
    статус candidate.'
- en: diminuendo
  ru: диминуэндо
  status: candidate
  note: 'Постепенное ослабление громкости; в данной главе синоним decrescendo. Основание: пилот
    глав 6–8, docs/reviews/other-notation.md; статус candidate.'
- en: hairpin
  ru: вилочка
  status: candidate
  note: 'Знак крещендо или декрещендо. Основание: пилот глав 6–8, docs/reviews/other-notation.md;
    статус candidate.'
- en: articulation
  ru: артикуляция
  status: candidate
  note: 'Характер соединения/разделения звуков, их произнесения и атаки. Основание: пилот глав
    6–8, docs/reviews/other-notation.md; статус candidate.'
- en: attack
  ru: атака
  status: candidate
  note: 'Начало звука, в отличие от поддержания или затухания. Основание: пилот глав 6–8, docs/reviews/other-notation.md;
    статус candidate.'
- en: legato
  ru: легато
  status: candidate
  note: 'Связное исполнение. Основание: пилот глав 6–8, docs/reviews/other-notation.md; статус
    candidate.'
- en: slur
  ru: лига легато
  status: candidate
  note: 'Артикуляционная лига; не смешивать с соединительной лигой tie или вязкой beam. Согласовано
    между главами 7–8. Основание: пилот глав 6–8, docs/reviews/other-notation.md; статус candidate.'
- en: tenuto
  ru: тенуто
  status: candidate
  note: 'Выдерживание полной длительности, контекстно подчёркивание; не синоним legato. В главах
    7–8 отмечено упрощение оригинала. Основание: пилот глав 6–8, docs/reviews/other-notation.md;
    статус candidate.'
- en: staccato
  ru: стаккато
  status: candidate
  note: 'Раздельное исполнение с промежутками между звуками. Основание: пилот глав 6–8, docs/reviews/other-notation.md;
    статус candidate.'
- en: accent
  ru: акцент
  status: candidate
  note: 'Дополнительное выделение звука; исходный popup повреждён, определение из основного
    текста. Основание: пилот глав 6–8, docs/reviews/other-notation.md; статус candidate.'
- en: marcato
  ru: маркато
  status: candidate
  note: 'В данной главе более сильный акцент; знак в форме перевёрнутой V. Основание: пилот
    глав 6–8, docs/reviews/other-notation.md; статус candidate.'
- en: tempo
  ru: темп
  status: candidate
  note: 'Скорость исполнения. Основание: пилот глав 6–8, docs/reviews/other-notation.md; статус
    candidate.'
- en: metronome marking
  ru: метрономическое обозначение
  status: candidate
  note: 'Задаёт длительность единицы пульса и её число в минуту. Основание: пилот глав 6–8,
    docs/reviews/other-notation.md; статус candidate.'
- en: ritardando
  ru: ритардандо
  status: candidate
  note: 'Постепенное замедление. Основание: пилот глав 6–8, docs/reviews/other-notation.md;
