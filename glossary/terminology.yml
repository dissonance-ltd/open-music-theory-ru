  status: candidate
  alternatives:
  - звуковысотность
  note: Требуется согласовать употребление термина как свойства звука и как отдельной высоты.
- en: pitch class
  ru: высотный класс
  status: candidate
  alternatives:
  - класс высот
  note: Особенно важно согласовать с терминологией теории множеств.
- en: scale degree
  ru: ступень гаммы
  status: candidate
