[project]
name = "open-music-theory-ru-tools"
version = "0.1.0"
description = "Source import and validation tools for Open Music Theory RU"
requires-python = ">=3.12"
dependencies = [
    "lxml==6.1.1",
    "PyYAML==6.0.3",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.8",
    "types-PyYAML==6.0.12.20260906",
    "types-lxml==2026.2.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests"]
mypy_path = "scripts"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
