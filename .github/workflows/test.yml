name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements-dev.txt
      - name: Check Python formatting, lint and types
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
          mypy
      - name: Validate sources and translations
        run: |
          python -m unittest discover -s tests -v
          python scripts/render_glossary.py --check
          python scripts/check_book.py
      - name: Install mdBook
        run: bash scripts/install-mdbook-ci.sh
      - name: Build book
        run: mdbook build
      - name: Check rendered local links and accessibility labels
        run: python scripts/check_book.py --built
      - uses: actions/upload-artifact@v4
        with:
          name: book-preview
          path: book
