name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: bash scripts/install-mdbook-ci.sh
      - name: Build book
        run: mdbook build
      - uses: actions/upload-artifact@v4
        with:
          name: book-preview
          path: book
