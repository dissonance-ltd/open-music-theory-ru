name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked dependencies
        run: uv sync --locked --no-dev
      - name: Validate sources and translations
        run: |
          uv run --locked --no-dev python -m unittest discover -s tests -v
          uv run --locked --no-dev python scripts/render_glossary.py --check
          uv run --locked --no-dev python scripts/check_book.py
      - name: Install mdBook
        run: bash scripts/install-mdbook-ci.sh
      - name: Build book
        run: mdbook build
      - name: Check rendered local links and accessibility labels
        run: uv run --locked --no-dev python scripts/check_book.py --built
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
