name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate sources and translations
        run: |
          python -m unittest discover -s tests -v
          python scripts/render_glossary.py --check
          python scripts/check_book.py
      - name: Install mdBook
        run: bash scripts/install-mdbook-ci.sh
      - name: Build book
        run: mdbook build
      - name: Check rendered local links and accessibility labels
        run: python scripts/check_book.py --built
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
